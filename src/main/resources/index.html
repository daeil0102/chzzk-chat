<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>치지직 채팅</title>
  <style>
    @font-face {
      font-family: "Jua";
      src: url('/fonts/Jua-Regular.ttf?v=__CHAT_RESOURCE_VERSION__') format('truetype');
      font-weight: 400;
      font-display: swap;
    }
    :root {
      color-scheme: light;
      font-family: "Jua", "Malgun Gothic", system-ui, sans-serif;
      color: #285570;
      background: #e9f6ff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { display: flex; flex-direction: column; min-height: 100dvh; height: 100dvh; }
    #feed {
      --main-backgrund-image: url('/images/center/main_backgrund.png?v=__CHAT_RESOURCE_VERSION__');
      --base-backgrund-image: url('/images/center/base_backgrund.png?v=__CHAT_RESOURCE_VERSION__');
      --backgrund-middle-image: url('/images/center/backgrund_middle.png?v=__CHAT_RESOURCE_VERSION__');
      --backgrund-left-image: url('/images/center/backgrund_left.png?v=__CHAT_RESOURCE_VERSION__');
      --backgrund-right-image: url('/images/center/backgrund_right.png?v=__CHAT_RESOURCE_VERSION__');
      --top-bar-image: url('/images/center/top_bar.png?v=__CHAT_RESOURCE_VERSION__');
      --bottom-bar-image: url('/images/center/bottom_bar.png?v=__CHAT_RESOURCE_VERSION__');
      --chat-motion-x: 0px;
      --chat-motion-y: 0px;
      flex: 1; min-height: 0; overflow: clip; padding: 24px 14px 22px;
      background: #e9f6ff var(--main-backgrund-image) center / cover no-repeat;
    }
    #feed[data-horizontal-growth="left"] {
      --main-backgrund-image: url('/images/left/main_backgrund.png?v=__CHAT_RESOURCE_VERSION__');
      --backgrund-middle-image: url('/images/left/backgrund_middle.png?v=__CHAT_RESOURCE_VERSION__');
      --backgrund-left-image: url('/images/left/backgrund_left.png?v=__CHAT_RESOURCE_VERSION__');
      --backgrund-right-image: url('/images/left/backgrund_right.png?v=__CHAT_RESOURCE_VERSION__');
    }
    #messages {
      --chat-gap: 0px;
      --icon-size: 130px;
      --font-size: 60px;
      --chat-max-width: 100cqw;
      --top-bar-offset: 10px;
      --active-top-bar-offset: var(--top-bar-offset);
      --bottom-bar-height: 9px;
      --card-radius: 0px;
      --side-width: 48px;
      --icon-offset-x: 0px;
      --icon-offset-y: 0px;
      --icon-motion-distance: 3px;
      --icon-motion-duration: 2800ms;
      --icon-overhang: max(0px, calc(var(--icon-size) - 12px));
      --icon-top: calc(var(--icon-offset-y) - var(--icon-overhang) - var(--active-top-bar-offset));
      --top-overhang: max(var(--active-top-bar-offset), calc(0px - var(--icon-top) + max(0px, var(--icon-motion-distance) - 3px)));
      container-type: inline-size;
      display: flex; flex-direction: column; align-items: center; justify-content: unsafe flex-end;
      height: 100%; gap: max(0px, var(--chat-gap)); margin: 0; padding: 5px 0 0; list-style: none;
    }
    #messages[data-growth-direction="down"] { flex-direction: column-reverse; }
    #messages[data-chat-align="left"] { align-items: flex-start; }
    #messages[data-chat-align="right"] { align-items: flex-end; }
    @media (prefers-reduced-motion: no-preference) {
      #feed[data-chat-motion] {
        padding: calc(24px + var(--chat-motion-y)) calc(14px + var(--chat-motion-x))
                 calc(22px + var(--chat-motion-y));
      }
      #feed[data-chat-motion] #messages {
        --vertical-drift: chat-drift-y calc(var(--chat-motion-duration) / 2) ease-in-out
                          calc(var(--chat-motion-duration) / -4) infinite alternate;
        --horizontal-drift: chat-drift-x calc(var(--chat-motion-duration) / 2) ease-in-out infinite alternate;
        animation: var(--vertical-drift), var(--horizontal-drift);
      }
      #feed[data-chat-motion][data-chat-stagger] #messages {
        animation: var(--vertical-drift);
      }
      #feed[data-chat-motion][data-chat-stagger] .card-surface {
        animation: var(--horizontal-drift);
        animation-delay: var(--chat-motion-phase, 0ms);
      }
      #feed[data-chat-motion][data-chat-stagger] .card[data-reverse-drift] .card-surface {
        animation-direction: alternate-reverse;
      }
    }
    @keyframes chat-drift-x {
      from { translate: calc(0px - var(--chat-motion-x)) 0; }
      to { translate: var(--chat-motion-x) 0; }
    }
    @keyframes chat-drift-y {
      from { transform: translateY(calc(0px - var(--chat-motion-y))); }
      to { transform: translateY(var(--chat-motion-y)); }
    }
    #feed[data-horizontal-growth="left"] #messages {
      --active-top-bar-offset: 0px;
      --bottom-bar-height: 0px;
    }
    .card {
      --message-line-height: calc(var(--font-size) * 1.3);
      --detail-height: max(69px, calc(var(--message-line-height) + 13px));
      position: relative; width: fit-content; min-width: min(114px, 100%, var(--chat-max-width));
      max-width: min(100%, var(--chat-max-width)); min-height: var(--detail-height);
      flex-shrink: 0; text-align: center; overflow-wrap: anywhere;
      margin: var(--top-overhang) 0 var(--bottom-bar-height);
      animation: enter 300ms ease-out both;
    }
    .card-surface {
      position: relative; min-height: var(--detail-height);
      display: flex; flex-direction: column; justify-content: center;
      /* Size the padding from the list so it counts toward the card's fit-content width. */
      padding: 8px min(calc(var(--side-width) + 4px), 20cqw, calc(var(--chat-max-width) / 4));
    }
    #feed:not([data-horizontal-growth="left"]) .card-surface {
      background: var(--base-backgrund-image) center bottom / 100% 100% no-repeat;
    }
    .card-details {
      position: absolute; inset: 0;
      overflow: hidden; pointer-events: none;
    }
    #feed[data-horizontal-growth="left"] .card-details {
      border-radius: var(--card-radius);
    }
    #feed:not([data-horizontal-growth="left"]) .card-details {
      inset: auto 0 0; height: var(--detail-height);
    }
    #feed:not([data-horizontal-growth="left"]) #messages[data-growth-direction="down"] .card-details {
      inset: 0 0 auto;
    }
    .card-details::before, .card-details::after {
      content: ""; position: absolute; inset: 0;
    }
    .card-details::before {
      background: var(--backgrund-middle-image) center bottom / clamp(0px, calc(100% - var(--side-width) - var(--side-width) + 4px), 100%) 109% no-repeat;
    }
    #feed:not([data-horizontal-growth="left"]) .card-details::before {
      clip-path: inset(8% 0 0);
      background-size: clamp(0px, calc(100% - var(--side-width) - var(--side-width) + 4px), 100%) 100%;
    }
    .card-details::after {
      background:
        var(--backgrund-left-image) left bottom / min(var(--side-width), 50%) 100% no-repeat,
        var(--backgrund-right-image) right bottom / min(var(--side-width), 50%) 100% no-repeat;
    }
    #feed:not([data-horizontal-growth="left"]) .card-details::after {
      background-size: min(var(--side-width), 50%) auto, min(var(--side-width), 50%) auto;
    }
    .card + .card {
      margin-top: calc(var(--top-overhang) + min(0px, var(--chat-gap)));
    }
    .card-surface::before {
      content: ""; position: absolute; inset: calc(0px - var(--active-top-bar-offset)) 0 auto;
      height: calc(var(--active-top-bar-offset) + 2px);
      border-radius: var(--card-radius) var(--card-radius) 0 0; z-index: 1;
      background: transparent var(--top-bar-image) left top / auto 100% repeat-x;
    }
    .card-surface::after {
      content: ""; position: absolute; inset: 100% 0 auto; height: var(--bottom-bar-height);
      border-radius: 0 0 var(--card-radius) var(--card-radius);
      background: transparent var(--bottom-bar-image) left bottom / auto 100% repeat-x;
      pointer-events: none;
    }
    #feed[data-horizontal-growth="left"] .card-surface::before,
    #feed[data-horizontal-growth="left"] .card-surface::after { content: none; }
    .mascot {
      position: absolute; top: var(--icon-top); left: calc(50% + var(--icon-offset-x));
      transform: translateX(-50%); z-index: 2;
      width: min(var(--icon-size), 100%); height: var(--icon-size); object-fit: contain; pointer-events: none;
    }
    #feed[data-horizontal-growth="left"] .mascot {
      left: calc(min(var(--icon-size), 100%) / 2 + var(--icon-offset-x));
    }
    .card .mascot { animation: bob var(--icon-motion-duration) ease-in-out infinite alternate; }
    .card:nth-child(even) .mascot { animation-delay: calc(var(--icon-motion-duration) * -0.3); }
    @keyframes enter {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bob {
      to { transform: translate(-50%, calc(0px - var(--icon-motion-distance))); }
    }
    @media (prefers-reduced-motion: reduce) {
      .card, .card .mascot { animation: none !important; }
    }
    .message {
      position: relative;
      margin: 3px 0 0;
      font-size: var(--font-size); font-weight: 400; line-height: var(--message-line-height);
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <main>
    <section id="feed" aria-label="채팅" tabindex="0">
      <ol id="messages"></ol>
    </section>
  </main>
  <script>
    const feed = document.getElementById('feed');
    const messages = document.getElementById('messages');
    const resourceVersion = '__CHAT_RESOURCE_VERSION__';
    const viewMode = window.location.pathname.replace(/\/+$/, '').slice(1);
    const chatEndpoint = viewMode ? '/api/chat/' + viewMode : '/api/chat';
    let lastId = 0;
    let chatGap = 0;
    let iconSize = 130;
    let fontSize = 60;
    let maxChatWidth = 0;
    let topBarOffset = 10;
    let sideWidth = 48;
    let cardRadius = 0;
    let iconOffsetX = 0;
    let iconOffsetY = 0;
    let iconMotionDistance = 3;
    let iconMotionDuration = 2800;
    let chatMotionX = 0;
    let chatMotionY = 0;
    let chatMotionDuration = 4000;
    let chatMotionStagger = 0;

    function setChatMotionPhase(card, elapsed) {
      // Base the phase on the page clock so new cards join the existing motion.
      const stagger = (Number(card.dataset.messageId) * chatMotionStagger) % chatMotionDuration;
      const phase = (elapsed % chatMotionDuration - stagger + chatMotionDuration) % chatMotionDuration;
      card.style.setProperty('--chat-motion-phase', -phase + 'ms');
    }

    async function refresh() {
      try {
        const response = await fetch(chatEndpoint, { cache: 'no-store', signal: AbortSignal.timeout(5000) });
        if (!response.ok) throw new Error(response.status);
        const snapshot = await response.json();
        if (snapshot.resourceVersion && snapshot.resourceVersion !== resourceVersion) {
          window.location.reload();
          return;
        }
        const growthDirection = snapshot.layout?.growthDirection === 'down' ? 'down' : 'up';
        if (messages.dataset.growthDirection !== growthDirection) {
          messages.dataset.growthDirection = growthDirection;
        }
        const horizontalGrowth = snapshot.layout?.horizontalGrowth === 'unidirectional' ? 'left' : 'center';
        const alignment = snapshot.layout?.chatAlign;
        const chatAlign = ['left', 'center', 'right'].includes(alignment)
          ? alignment : horizontalGrowth === 'left' ? 'right' : 'center';
        if (messages.dataset.chatAlign !== chatAlign) {
          messages.dataset.chatAlign = chatAlign;
        }
        if (Number.isInteger(snapshot.layout?.cardRadius) && snapshot.layout.cardRadius !== cardRadius) {
          cardRadius = snapshot.layout.cardRadius;
          messages.style.setProperty('--card-radius', cardRadius + 'px');
        }
        const iconSource = '/images/' + horizontalGrowth + '/icon.png?v=' + resourceVersion;
        if (feed.dataset.horizontalGrowth !== horizontalGrowth) {
          feed.dataset.horizontalGrowth = horizontalGrowth;
          for (const icon of messages.querySelectorAll('.mascot')) {
            icon.src = iconSource;
          }
        }
        if (Number.isInteger(snapshot.layout?.chatGap) && snapshot.layout.chatGap !== chatGap) {
          chatGap = snapshot.layout.chatGap;
          messages.style.setProperty('--chat-gap', chatGap + 'px');
        }
        if (Number.isInteger(snapshot.layout?.iconSize) && snapshot.layout.iconSize !== iconSize) {
          iconSize = snapshot.layout.iconSize;
          messages.style.setProperty('--icon-size', iconSize + 'px');
        }
        if (Number.isInteger(snapshot.layout?.fontSize) && snapshot.layout.fontSize !== fontSize) {
          fontSize = snapshot.layout.fontSize;
          messages.style.setProperty('--font-size', fontSize + 'px');
        }
        if (Number.isInteger(snapshot.layout?.maxChatWidth) && snapshot.layout.maxChatWidth !== maxChatWidth) {
          maxChatWidth = snapshot.layout.maxChatWidth;
          messages.style.setProperty('--chat-max-width', maxChatWidth === 0 ? '100cqw' : maxChatWidth + 'px');
        }
        if (Number.isInteger(snapshot.layout?.topBarOffset) && snapshot.layout.topBarOffset !== topBarOffset) {
          topBarOffset = snapshot.layout.topBarOffset;
          messages.style.setProperty('--top-bar-offset', topBarOffset + 'px');
        }
        if (Number.isInteger(snapshot.layout?.sideWidth) && snapshot.layout.sideWidth !== sideWidth) {
          sideWidth = snapshot.layout.sideWidth;
          messages.style.setProperty('--side-width', sideWidth + 'px');
        }
        if (Number.isInteger(snapshot.layout?.iconOffsetX) && snapshot.layout.iconOffsetX !== iconOffsetX) {
          iconOffsetX = snapshot.layout.iconOffsetX;
          messages.style.setProperty('--icon-offset-x', iconOffsetX + 'px');
        }
        if (Number.isInteger(snapshot.layout?.iconOffsetY) && snapshot.layout.iconOffsetY !== iconOffsetY) {
          iconOffsetY = snapshot.layout.iconOffsetY;
          messages.style.setProperty('--icon-offset-y', iconOffsetY + 'px');
        }
        const { iconMotionDistance: distance, iconMotionDurationMs: duration } = snapshot.layout ?? {};
        if (Number.isInteger(distance) && Number.isInteger(duration) &&
            (distance !== iconMotionDistance || duration !== iconMotionDuration)) {
          iconMotionDistance = distance;
          iconMotionDuration = duration;
          messages.style.setProperty('--icon-motion-distance', (duration === 0 ? 0 : distance) + 'px');
          messages.style.setProperty('--icon-motion-duration', duration + 'ms');
        }
        const { chatMotionX: motionX = 0, chatMotionY: motionY = 0,
                chatMotionDurationMs: motionDuration = 4000,
                chatMotionStaggerMs: motionStagger = 0 } = snapshot.layout ?? {};
        const elapsed = document.timeline?.currentTime ?? 0;
        const staggerEnabled = motionDuration > 0 && motionX > 0 && motionStagger > 0;
        const phaseChanged = motionStagger !== chatMotionStagger || motionDuration !== chatMotionDuration ||
                             (motionX > 0) !== (chatMotionX > 0);
        if (motionX !== chatMotionX || motionY !== chatMotionY || motionDuration !== chatMotionDuration) {
          chatMotionX = motionX;
          chatMotionY = motionY;
          chatMotionDuration = motionDuration;
          feed.style.setProperty('--chat-motion-x', motionX + 'px');
          feed.style.setProperty('--chat-motion-y', motionY + 'px');
          feed.style.setProperty('--chat-motion-duration', motionDuration + 'ms');
          feed.toggleAttribute('data-chat-motion', motionDuration > 0 && (motionX > 0 || motionY > 0));
        }
        if (phaseChanged) {
          chatMotionStagger = motionStagger;
          feed.toggleAttribute('data-chat-stagger', staggerEnabled);
          if (staggerEnabled) {
            for (const card of messages.children) setChatMotionPhase(card, elapsed);
          }
        }
        if (!snapshot.messages.length || snapshot.messages.at(-1).id < lastId) {
          messages.replaceChildren();
          lastId = 0;
        }
        for (const message of snapshot.messages) {
          if (message.id <= lastId) continue;
          const row = document.createElement('li');
          row.className = 'card';
          row.dataset.messageId = message.id;
          row.toggleAttribute('data-reverse-drift', message.id % 2 === 0);
          if (staggerEnabled) setChatMotionPhase(row, elapsed);
          const surface = document.createElement('div');
          surface.className = 'card-surface';
          const details = document.createElement('span');
          details.className = 'card-details';
          details.setAttribute('aria-hidden', 'true');
          const mascot = document.createElement('img');
          mascot.className = 'mascot';
          mascot.src = iconSource;
          mascot.alt = '';
          const body = document.createElement('p');
          body.className = 'message';
          body.textContent = message.content;
          surface.append(details, body);
          row.append(surface, mascot);
          messages.append(row);
          lastId = message.id;
        }
        while (messages.children.length > snapshot.messages.length) messages.firstElementChild.remove();

      } catch {
        // Keep displayed chat while the local server reconnects.
      } finally {
        setTimeout(refresh, 1000);
      }
    }
    refresh();
  </script>
</body>
</html>
